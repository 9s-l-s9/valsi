name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.emacs-version == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        # Supported floor, maintained releases, and early warning for development.
        emacs-version: ['29.1', '30.2', '31.1', 'snapshot']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7 # 2026-08-24
        with:
          version: ${{ matrix.emacs-version }}
      # compile (warnings are errors) + checkdoc + verify-meta + ERT, same
      # gate as local.  No optional packages: proves the core needs none.
      - run: make check

  # The optional dependencies (markdown-mode, Eat) exercised once, so the
  # terminal-agent and font-lock paths compile and run against them.
  check-optional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7 # 2026-08-24
        with:
          version: '31.1'
      - name: Install optional packages
        run: |
          emacs -Q --batch --eval "(progn
            (require 'package)
            (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)
            (add-to-list 'package-archives '(\"nongnu\" . \"https://elpa.nongnu.org/nongnu/\") t)
            (package-initialize)
            (package-refresh-contents)
            (dolist (p '(markdown-mode eat)) (package-install p)))"
      # EMACS must be a bare program name (ensure-emacs runs command -v on
      # it), so wrap the package-initialize call in a script.
      - name: make check with optional packages on the load path
        run: |
          cat > /usr/local/bin/emacs-with-packages <<'SH'
          #!/bin/sh
          exec emacs --eval "(progn (require 'package) (package-initialize))" "$@"
          SH
          chmod +x /usr/local/bin/emacs-with-packages
          make check EMACS=emacs-with-packages

  info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: sudo apt-get update && sudo apt-get install -y texinfo
      - name: Build the manual without warnings
        run: |
          # Texinfo has no warnings-as-errors option. Keep diagnostics visible
          # on failure, and reject warnings even when makeinfo exits zero.
          if ! make info 2>makeinfo.log; then
            cat makeinfo.log >&2
            exit 1
          fi
          cat makeinfo.log >&2
          test ! -s makeinfo.log

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: make test-extension
